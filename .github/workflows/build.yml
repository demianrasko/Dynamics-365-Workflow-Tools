name: Build and test

on:
  push:
    # not tags: the Release workflow builds and tests those
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Set up NuGet
        uses: NuGet/setup-nuget@v4

      - name: Restore packages
        run: nuget restore msdyncrmWorkflowTools\msdyncrmWorkflowTools.sln

      - name: Build (Release)
        run: msbuild msdyncrmWorkflowTools\msdyncrmWorkflowTools.sln /p:Configuration=Release /m /nologo /v:m

      - name: Build Power Platform assembly (Release)
        run: msbuild msdyncrmWorkflowTools\msdyncrmWorkflowTools\msdyncrmWorkflowTools.csproj /p:Configuration=Release /p:PowerPlatform=true /nologo /v:m

      - name: Install the Power Platform CLI
        shell: pwsh
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build the solution files
        shell: pwsh
        run: .\tools\Build-Solutions.ps1 -SkipBuild

      - name: Run tests
        shell: pwsh
        run: |
          $vstest = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find "**\vstest.console.exe" | Select-Object -First 1
          & $vstest msdyncrmWorkflowTools\msdyncrmWorkflowTools_Tests\bin\Release\msdyncrmWorkflowTools_Tests.dll /Logger:trx /ResultsDirectory:TestResults
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults

      - name: Upload workflow assembly
        uses: actions/upload-artifact@v7
        with:
          name: msdyncrmWorkflowTools
          path: msdyncrmWorkflowTools\msdyncrmWorkflowTools\bin\Release\msdyncrmWorkflowTools.dll

      - name: Upload Power Platform workflow assembly
        uses: actions/upload-artifact@v7
        with:
          name: powerplatformWorkflowTools
          path: msdyncrmWorkflowTools\msdyncrmWorkflowTools\bin\Release-PowerPlatform\powerplatformWorkflowTools.dll

      - name: Upload solution files
        uses: actions/upload-artifact@v7
        with:
          name: solutions
          path: dist
